# Docker Compose for Payment Service
# This service connects to the shared infrastructure (Kafka + MongoDB)
# Shared infrastructure is deployed separately - see shared-infrastructure/docker-compose.yml

services:
  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "5003:5003"  # HTTP port
      - "50031:50031"  # gRPC port
    environment:
      HTTP_PORT: 5003
      GRPC_PORT: 50031
      # Connect to shared Kafka cluster (using internal network)
      KAFKA_BROKERS: kafka-broker:29092
      KAFKA_CLIENT_ID: payment-service-client
      LOG_LEVEL: info
    networks:
      - shared-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

networks:
  shared-network:
    external: true
    name: shared-infrastructure_shared-network
